<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Rivals Guide - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container1">
        <div class="logo-top">
            <img src="resouces/logo.png" alt="A Beginner's Guide to Roblox Rivals">
        </div>

        <div class="inner-content-box">
            <header>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index2.html">Movement tech</a></li>
                        <li><a href="index3.html" class="active">Contact</a></li>
                    </ul>
                </nav>
            </header>        

            <div class="contact-layout">
                <div class="contact-graphic">
                    <img src="resouces/logo.png" alt="Roblox Rivals Combat Illustration">
                </div>

                <div class="form-container">
                    <h2>Contact Form</h2>
                    
                    <form action="#" method="POST">
                        <div class="form-row-split">
                            <div class="input-group">
                                <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
                            </div>
                            <div class="input-group">
                                <input type="text" id="lastname" name="lastname" placeholder="Last Name">
                            </div>
                        </div>

                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Email Address" required>
                        </div>

                        <div class="input-group">
                            <textarea id="message" name="message" rows="5" placeholder="Message" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn">SEND</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
